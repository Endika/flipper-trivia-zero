name: CI

on:
  # Only main: an unfiltered push trigger fires a second, identical run for every
  # branch push that already has a pull_request run.
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cppcheck clang-format
      - name: Run linter
        run: make linter
      - name: Check format
        run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run --Werror
      - name: Run tests
        run: make test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
          working-directory: tools
      - name: Install Python deps
        run: cd tools && uv sync --all-groups --frozen
      - name: Ruff check
        run: cd tools && uv run ruff check .
      - name: Ruff format check
        run: cd tools && uv run ruff format --check .
      - name: Mypy
        run: cd tools && uv run mypy --strict trivia_pack
      - name: Pytest
        run: cd tools && uv run pytest

  fap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build FAP
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          sdk-channel: release

  all-green:
    name: all-green
    needs: [test, python, fap]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every required job must have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
